<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Axis &amp; Sliders</title>
  <link rel="stylesheet" href="axis-sliders.css">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 16px;
      box-sizing: border-box;
      background: linear-gradient(160deg, #f5f8fc 0%, #eef5f9 50%, #f4f1fb 100%);
      font-family: var(--as-font);
    }
  </style>
</head>
<body>
  <div id="widget"></div>

  <script src="axis-sliders.js"></script>
  <script>
    new AxisSliders(document.getElementById('widget'), {
      title: 'Adjust your values',
      xLabel: 'X', yLabel: 'Y',
      min: 0, max: 100, step: 1,
      x: 40, y: 65,
    });
  </script>
</body>
</html>
